[build-system]
requires      = [ 'setuptools >= 61.0' ]
build-backend = 'setuptools.build_meta'

[project]
name        = 'line-rt'
version     = '0.1.0'
description = 'Line radiative-transfer pipeline (Kratos backend)'
readme      = 'README.md'
requires-python = '>=3.10'
dependencies = [
    'numpy',
    'scipy',
    'matplotlib',
]

[project.optional-dependencies]
ui  = [ 'ipywidgets' ]
web = [ 'panel' ]
all = [ 'ipywidgets', 'panel', 'requests' ]

[project.scripts]
line-rt = 'cli:main'

[tool.setuptools]
#  Src-less layout: packages live at repo root.
py-modules = [ 'cli' ]

[tool.setuptools.packages.find]
include = [ 'core*', 'molecular*', 'ui*', 'web*' ]

[tool.setuptools.package-data]
#  Ship species data and par templates with the wheel.
molecular = [ 'embedded/*.dat' ]
core      = [ '*.par' ]
